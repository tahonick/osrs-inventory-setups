<header class="header" [class.header-hidden]="!isHeaderVisible">
  <div class="header-content">
    <div class="logo-section" routerLink="/">
      <div class="logo">
        <mat-icon>inventory_2</mat-icon>
        <div class="title-group">
          <h1>Inventory Setups Viewer</h1>
          <span class="subtitle">Community tool (Not the RuneLite plugin)</span>
        </div>
      </div>
    </div>

    <div class="stats" *ngIf="isStatsLoaded$ | async; else loadingStats">
      <div class="stat">
        <mat-icon>inventory_2</mat-icon>
        <div class="stat-info">
          <div class="stat-value">{{ (stats$ | async)?.totalLoadouts | number }}</div>
          <div class="stat-label">Setups</div>
        </div>
      </div>
      <div class="stat">
        <mat-icon>group</mat-icon>
        <div class="stat-info">
          <div class="stat-value">{{ (stats$ | async)?.totalUsers | number }}</div>
          <div class="stat-label">Visits</div>
        </div>
      </div>
      <div class="stat">
        <span class="fire-emoji">🔥</span>
        <div class="stat-info">
          <div class="stat-value">{{ (stats$ | async)?.newToday | number }}</div>
          <div class="stat-label">New Today</div>
        </div>
      </div>
    </div>

    <ng-template #loadingStats>
      <div class="stats loading">
        <div class="stat">
          <mat-icon>inventory_2</mat-icon>
          <div class="stat-info">
            <div class="stat-value placeholder"></div>
            <div class="stat-label">Setups</div>
          </div>
        </div>
        <div class="stat">
          <mat-icon>group</mat-icon>
          <div class="stat-info">
            <div class="stat-value placeholder"></div>
            <div class="stat-label">Visits</div>
          </div>
        </div>
        <div class="stat">
          <span class="fire-emoji">🔥</span>
          <div class="stat-info">
            <div class="stat-value placeholder"></div>
            <div class="stat-label">New Today</div>
          </div>
        </div>
      </div>
    </ng-template>

    <div class="header-actions">
      <ng-container *ngIf="currentUser$ | async as user; else signedOut">
        <!-- Show user info when signed in with Google - clickable to edit profile -->
        <button 
          mat-stroked-button
          class="user-profile-button"
          *ngIf="!user.isAnonymous"
          (click)="openUserProfile()"
          matTooltip="Edit profile">
          <mat-icon class="user-icon">account_circle</mat-icon>
          <span class="user-name">{{ user.displayName || user.email }}</span>
        </button>

        <!-- Admin button (only visible to admins) -->
        <button
          mat-icon-button
          *ngIf="isAdmin$ | async"
          (click)="navigateToAdmin()"
          class="admin-button"
          matTooltip="Admin Portal">
          <mat-icon>admin_panel_settings</mat-icon>
        </button>

        <button
          mat-stroked-button
          class="auth-button"
          [class.signed-in]="!user.isAnonymous"
          (click)="user.isAnonymous ? signInWithGoogle() : signOut()"
          [matTooltip]="user.isAnonymous ? 'Sign in with Google' : 'Sign out'">
          <mat-icon>{{ user.isAnonymous ? 'login' : 'logout' }}</mat-icon>
          <span>{{ user.isAnonymous ? 'Sign in' : 'Sign out' }}</span>
        </button>
      </ng-container>
      <ng-template #signedOut>
        <button
          mat-stroked-button
          class="auth-button"
          (click)="signInWithGoogle()"
          matTooltip="Sign in with Google">
          <mat-icon>login</mat-icon>
          <span>Sign in</span>
        </button>
      </ng-template>

      <button mat-icon-button (click)="toggleTheme()" class="theme-toggle" matTooltip="Toggle theme">
        <mat-icon>{{ (isDarkTheme$ | async) ? 'dark_mode' : 'light_mode' }}</mat-icon>
      </button>
    </div>
  </div>
</header>
